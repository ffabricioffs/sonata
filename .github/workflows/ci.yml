name: CI

# R22 — typecheck e lint a cada push e pull request
on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # o postinstall roda "prisma generate"; não precisa de banco
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # ESLint 9 + eslint-config-next 16 (eslint.config.mjs)
      - name: Lint
        run: npm run lint
